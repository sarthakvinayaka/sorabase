[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Audio uploads volume — must be provisioned in Railway dashboard as a volume
# mounted at /app/uploads/audio, otherwise uploaded files are lost on redeploy.
# Dashboard: Service → Volumes → Add Volume → Mount path: /app/uploads/audio
